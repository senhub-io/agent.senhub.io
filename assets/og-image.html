<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(900px 500px at 85% -10%, rgba(0, 202, 246, 0.12), transparent 60%),
          radial-gradient(800px 520px at 8% 115%, rgba(252, 190, 54, 0.16), transparent 60%),
          #fbfbfd;
        color: #1f2430;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 84px 92px;
        position: relative;
      }
      .robot { position: absolute; top: 70px; right: 92px; width: 150px; height: 150px; }
      .eyebrow {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #0091bd;
        margin-bottom: 26px;
      }
      h1 {
        font-size: 66px;
        line-height: 1.06;
        font-weight: 800;
        letter-spacing: -0.02em;
        max-width: 18ch;
        margin-bottom: 28px;
      }
      h1 .hl {
        background: linear-gradient(transparent 56%, rgba(252, 190, 54, 0.55) 56%);
        padding: 0 8px;
        border-radius: 3px;
      }
      p {
        font-size: 30px;
        color: #5b6472;
        max-width: 32ch;
        line-height: 1.4;
      }
      .sinks {
        display: flex;
        gap: 14px;
        margin-top: 46px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 22px;
        font-weight: 600;
        padding: 11px 20px;
        border-radius: 999px;
        border: 1px solid #e7e9ef;
        background: #fff;
      }
      .chip b { color: #0091bd; }
      .brand {
        position: absolute;
        left: 92px;
        bottom: 64px;
        font-size: 26px;
        font-weight: 800;
        color: #1f2430;
      }
      .brand span { color: #0091bd; }
      .domain {
        position: absolute;
        right: 92px;
        bottom: 64px;
        font-size: 24px;
        color: #5b6472;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <svg class="robot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <rect x="57" y="20" width="6" height="20" rx="3" fill="#4a4a4a"/>
      <circle cx="60" cy="18" r="9" fill="#00caf6"/>
      <rect x="14" y="58" width="16" height="28" rx="6" fill="#c9c9c9"/>
      <rect x="90" y="58" width="16" height="28" rx="6" fill="#c9c9c9"/>
      <rect x="24" y="40" width="72" height="64" rx="16" fill="#4a4a4a"/>
      <rect x="33" y="49" width="54" height="46" rx="9" fill="#ededed"/>
      <circle cx="49" cy="66" r="7" fill="#fcbe36"/>
      <circle cx="71" cy="66" r="7" fill="#fcbe36"/>
      <rect x="42" y="80" width="36" height="11" rx="2" fill="none" stroke="#4a4a4a" stroke-width="3"/>
      <line x1="51" y1="80" x2="51" y2="91" stroke="#4a4a4a" stroke-width="3"/>
      <line x1="60" y1="80" x2="60" y2="91" stroke="#4a4a4a" stroke-width="3"/>
      <line x1="69" y1="80" x2="69" y2="91" stroke="#4a4a4a" stroke-width="3"/>
    </svg>

    <div class="eyebrow">Open source · OpenTelemetry-native</div>
    <h1>The <span class="hl">OpenTelemetry-native</span><br />infrastructure agent.</h1>
    <p>OTLP-first — into Prometheus, Grafana, and your existing PRTG / Nagios.</p>
    <div class="sinks">
      <span class="chip"><b>OTLP</b></span>
      <span class="chip"><b>Prometheus</b></span>
      <span class="chip"><b>Grafana</b></span>
      <span class="chip"><b>PRTG</b></span>
      <span class="chip"><b>Nagios</b></span>
    </div>

    <div class="brand">SenHub<span> Agent</span></div>
    <div class="domain">agent.senhub.io</div>
  </body>
</html>
